<!-- START::CARD -->
<div
  class="w-full flex flex-col items-start rounded-2xl gap-10 p-6 bg-bg-surface border border-border-default"
>
  <!-- START::HEADER -->
  <nav class="flex flex-row w-full items-center justify-between gap-4">
    <!-- START::TITLE & DESCRIPTION -->
    <div class="flex flex-col items-start gap-1">
      <span class="text-primary text-xl font-bold">{{ title() }}</span>
      <p class="text-secondary text-sm font-normal">{{ description() }}</p>
    </div>
    <!-- END::TITLE & DESCRIPTION -->

    <!-- START::CONTROLS -->
    <div class="flex flex-row items-center gap-3">
      <ng-content select=".card-header-controls"></ng-content>
    </div>
    <!-- END::CONTROLS -->
  </nav>
  <!-- END::HEADER -->

  <!-- START::CONTENT -->
  <div class="w-full overflow-x-scroll">
    <ng-content select=".card-body"></ng-content>
  </div>
  <!-- END::CONTENT -->
</div>
<!-- END::CARD -->
