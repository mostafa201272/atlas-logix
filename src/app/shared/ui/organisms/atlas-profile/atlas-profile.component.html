<!-- START::PROFILE CONTAINER -->
<div class="flex flex-row items-center gap-4">
  <!-- START::PROFILE CONTAINER -->
  <div class="flex flex-row items-center gap-3">
    <!-- START::AVATAR -->
    <div
      class="avatar bg-bg-accent text-text-on-dark w-10 h-10 rounded-xl flex flex-col items-center justify-center"
    >
      <span class="uppercase">{{ userData()?.characters }}</span>
    </div>
    <!-- END::AVATAR -->

    <!-- START::USER INFO -->
    <div class="flex flex-col items-start">
      <span class="text-primary text-sm font-semibold capitalize">{{ userData()?.name }}</span>
      <span class="text-secondary text-xs capitalize">{{ userData()?.role }}</span>
    </div>
    <!-- END::USER INFO -->
  </div>
  <!-- END::PROFILE CONTAINER -->

  <!-- START::LOGOUT -->
  <atlas-button
    variant="text"
    icon="pi pi-sign-out"
    size="large"
    (onClick)="logout()"
  ></atlas-button>
  <!-- END::LOGOUT -->
</div>
<!-- END::PROFILE CONTAINER -->
