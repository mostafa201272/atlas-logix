<!-- START::PROFILE CONTAINER -->
<div class="flex flex-row items-center gap-0 md:gap-4">
  <!-- START::PROFILE CONTAINER -->
  <div class="flex-row items-center gap-3 hidden md:flex">
    <!-- START::AVATAR -->
    <div
      class="avatar bg-bg-accent text-text-on-dark w-10 h-10 rounded-xl flex flex-col items-center justify-center shrink-0"
    >
      <span class="uppercase flex shrink-0">{{ userData()?.characters }}</span>
    </div>
    <!-- END::AVATAR -->

    <!-- START::USER INFO -->
    <div class="flex flex-col items-start">
      <span class="text-primary text-sm font-semibold capitalize">{{ userData()?.name }}</span>
      <span class="text-secondary text-xs capitalize">{{
        'roles.' + userData()?.role | translate
      }}</span>
    </div>
    <!-- END::USER INFO -->
  </div>
  <!-- END::PROFILE CONTAINER -->

  <!-- START::LOGOUT -->
  <atlas-button
    variant="text"
    icon="pi pi-sign-out"
    size="large"
    styleClasses="rtl:rotate-180 !p-1 w-fit md:!px-2 md:w-auto"
    (onClick)="logout()"
  ></atlas-button>
  <!-- END::LOGOUT -->
</div>
<!-- END::PROFILE CONTAINER -->
