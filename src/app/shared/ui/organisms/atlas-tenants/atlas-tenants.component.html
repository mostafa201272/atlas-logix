<!-- START::ATLAS-TENANTS COMPONENT -->
<div class="flex flex-row items-center gap-3">
  <!-- START::TENANT LABEL -->
  <atlas-label
    [class]="'hidden md:block'"
    [value]="'tenant.selectTenant' | translate"
    [styleClasses]="'text-text-secondary uppercase text-sm font-semibold'"
  ></atlas-label>
  <!-- END::TENANT LABEL -->

  <!-- START::TENANT DROPDOWN -->
  <p-select
    [options]="tenants()"
    [ngModel]="selectedTenant()"
    (ngModelChange)="onTenantChange($event)"
    [class]="'px-1 py-0 rounded-xl max-w-31 md:max-w-62  xl:max-w-auto'"
    optionLabel="name"
    [placeholder]="'tenant.selectTenant' | translate"
  />
  <!-- END::TENANT DROPDOWN -->
</div>
<!-- END::ATLAS-TENANTS COMPONENT -->
