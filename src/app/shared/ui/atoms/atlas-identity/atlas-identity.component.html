<!-- START::IDENTITY -->
<div class="flex flex-row items-center" [class]="gapClass()">
  <!-- START::LOGO -->
  <div class="flex shrink-0">
    <span
      class="flex shrink-0 [&>svg]:w-full [&>svg]:h-full"
      [inlineSVG]="'assets/media/svg/logo.svg'"
      [style.width.px]="logoDimensions()"
      [style.height.px]="logoDimensions()"
    ></span>
  </div>
  <!-- END::LOGO -->

  @if (!logoOnly()) {
    <div class="flex flex-col items-start gap-0.5">
      <!-- START::BRAND NAME -->
      <span
        class="text-navy font-bold leading-none"
        [class]="brandTextClass()"
        [class.text-white]="darkMode()"
        >Atlas<span class="text-brand-blue" [class.text-brand-teal-light]="darkMode()"
          >Logix</span
        ></span
      >
      <!-- END::BRAND NAME -->

      <!-- START::BRAND SLOGAN -->
      <span
        class="text-neutral-muted leading-tight"
        [class]="sloganTextClass()"
        [class.!text-dark-text-muted]="darkMode()"
        >{{ 'project.trackingCompliancePlatform' | translate }}</span
      >
      <!-- END::BRAND SLOGAN -->
    </div>
  }
</div>
<!-- END::IDENTITY -->
