<!-- START::ATLAS-DASHBOARD-HEADER COMPONENT -->
<header class="w-full flex flex-row items-center justify-between gap-4">
  <!-- START::HEADER CONTENT -->
  <div class="flex flex-col items-start gap-4">
    <!-- START::EYEBROW -->
    <span class="text-text-accent text-xs font-semibold uppercase">{{ eyebrow() }}</span>
    <!-- END::EYEBROW -->

    <!-- START::TITLE & SUB-TITLE CONTAINER -->
    <div class="flex flex-col items-start gap-1">
      <!-- START::TITLE -->
      <h1 class="text-primary text-4xl font-bold">{{ title() }}</h1>
      <!-- END::TITLE -->

      <!-- START::SUB-TITLE -->
      <p class="text-secondary text-sm font-normal">{{ subTitle() }}</p>
      <!-- END::SUB-TITLE -->
    </div>
    <!-- END::TITLE & SUB-TITLE CONTAINER -->
  </div>
  <!-- END::HEADER CONTENT -->

  <!-- START::HEADER CONTROLS -->
  <div class="flex flex-row items-center gap-3">
    <ng-content select=".header-controls"></ng-content>
  </div>
  <!-- END::HEADER CONTROLS -->
</header>
<!-- END::ATLAS-DASHBOARD-HEADER COMPONENT -->
