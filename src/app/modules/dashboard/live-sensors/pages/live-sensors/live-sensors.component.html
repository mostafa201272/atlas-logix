<div class="w-full flex flex-col items-start gap-8">
  <!-- START::HEADER -->
  <atlas-dashboard-header
    class="w-full"
    [eyebrow]="baseTranslationPoint + 'header.eyebrow' | translate"
    [title]="baseTranslationPoint + 'header.title' | translate"
    [subTitle]="baseTranslationPoint + 'header.subtitle' | translate"
  >
    <!-- START::CONTROLS -->
    <ng-container class="header-controls">
      <div class="flex flex-row items-center gap-4">
        <!-- START::LIVE STATUS INDICATOR -->
        @if (isStreaming()) {
          <div
            class="flex flex-row items-center gap-2 px-3 py-1.5 rounded-full bg-status-success-bg/20 border border-status-success-text/30"
          >
            <span class="relative flex h-2.5 w-2.5">
              <span
                class="animate-ping absolute inline-flex h-full w-full rounded-full bg-status-success-text opacity-75"
              ></span>
              <span
                class="relative inline-flex rounded-full h-2.5 w-2.5 bg-status-success-text"
              ></span>
            </span>
            <span class="text-xs font-semibold text-status-success-text uppercase tracking-wider">
              {{ baseTranslationPoint + 'header.streamingLive' | translate }}
            </span>
          </div>
        }
        <!-- END::LIVE STATUS INDICATOR -->

        <!-- START::STREAM TOGGLE BTN -->
        <atlas-button
          [label]="
            (isStreaming()
              ? baseTranslationPoint + 'header.stopStreamBtn'
              : baseTranslationPoint + 'header.startStreamBtn') | translate
          "
          [icon]="isStreaming() ? 'pi pi-pause-circle' : 'pi pi-play-circle'"
          [variant]="isStreaming() ? 'outlined' : undefined"
          [disabled]="isLoading()"
          (onClick)="toggleStream()"
        ></atlas-button>
        <!-- END::STREAM TOGGLE BTN -->
      </div>
    </ng-container>
    <!-- END::CONTROLS -->
  </atlas-dashboard-header>
  <!-- END::HEADER -->

  <!-- START::ERROR NOTIFICATION -->
  @if (error()) {
    <div
      class="w-full p-4 rounded-xl bg-status-negative-bg/20 border border-status-negative-text/30 text-status-negative-text text-sm font-medium"
    >
      {{ error() }}
    </div>
  }
  <!-- END::ERROR NOTIFICATION -->

  <!-- START::METRICS CARDS -->
  <atlas-live-sensor-metrics
    class="w-full"
    [telemetry]="latestTelemetry()"
  ></atlas-live-sensor-metrics>
  <!-- END::METRICS CARDS -->

  <!-- START::STREAM EVENT FEED TABLE CARD -->
  <atlas-card
    class="w-full"
    [title]="baseTranslationPoint + 'card.title' | translate"
    [description]="baseTranslationPoint + 'card.description' | translate"
  >
    <ng-container class="card-body">
      <atlas-live-sensor-feed-table [history]="streamHistory()"></atlas-live-sensor-feed-table>
    </ng-container>
  </atlas-card>
  <!-- END::STREAM EVENT FEED TABLE CARD -->
</div>
