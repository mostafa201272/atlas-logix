<div class="w-full flex flex-col items-start gap-10">
  <!-- START::HEADER -->
  <atlas-dashboard-header
    class="w-full"
    [eyebrow]="baseTranslationPoint + 'header.eyebrow' | translate"
    [title]="baseTranslationPoint + 'header.title' | translate"
    [subTitle]="baseTranslationPoint + 'header.subtitle' | translate"
  >
    <!-- START::CONTROLS -->
    <ng-container class="header-controls">
      <!-- START::CONTROLS -->
      <div class="flex flex-row items-center gap-2">
        <!-- START::REVIEW SHIPMENT BTN -->
        <atlas-button [icon]="'pi pi-refresh'" size="small" (onClick)="onRefresh()"></atlas-button>
        <!-- END::REVIEW SHIPMENT BTN -->
      </div>
      <!-- END::CONTROLS -->
    </ng-container>
    <!-- END::CONTROLS -->
  </atlas-dashboard-header>
  <!-- END::HEADER -->

  <!-- START::SHIPMENT TABLE -->
  <div class="w-full bg-bg-surface p-6 rounded-2xl border border-border-default shadow">
    <atlas-shipments-table></atlas-shipments-table>
  </div>
  <!-- END::SHIPMENT TABLE -->
</div>
